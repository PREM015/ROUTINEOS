name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `next build` and `tsc` both load the Prisma client, and `@/lib/prisma`
      # throws at import time without a connection string. The build never opens
      # a connection, so a syntactically valid placeholder is enough.
      - name: Provide placeholder DATABASE_URL
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/routineos_ci" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=ci-placeholder-secret-not-used-in-build" >> "$GITHUB_ENV"
          echo "AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "NEXTAUTH_SECRET=ci-placeholder-secret-not-used-in-build" >> "$GITHUB_ENV"

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
