name: Notification Scheduler

# Free, external 5-minute ticker for RoutineOS notifications.
#
# WHY THIS EXISTS
# ---------------
# Vercel Cron on a Hobby plan is limited to ~2 invocations per day, and Hobby
# *rejects the deployment outright* for any expression that runs more than once
# per day. The project previously had `*/5 * * * *`, `*/15 * * * *` and
# `0 * * * *` in vercel.json, which failed every build with:
#
#   Hobby accounts are limited to daily cron jobs.
#   This cron expression would run more than once per day.
#
# Those three entries were therefore removed from vercel.json. The two that
# remain (`0 1 * * *` daily scores, `0 2 * * 0` weekly insights) are
# once-per-day and deploy cleanly. This workflow is what delivers notifications.
#
# If the project is ever upgraded to Pro, the Vercel crons can be re-added as a
# redundant second driver — the endpoint is idempotent, so two drivers are safe.
#
# WHY GITHUB ACTIONS
# -----------------
# Free for public repositories, and 2,000 minutes/month for private ones. Each
# run below is a couple of `curl` calls, so actual billed time is seconds, not
# minutes. GitHub allows a 5-minute minimum for `schedule:` triggers.
#
# KNOWN LIMITATIONS (stated, not hidden)
#   * GitHub explicitly warns that scheduled workflows "may be delayed during
#     peak load, especially at the start of every hour." A reminder can arrive
#     several minutes late.
#   * A delay is NOT a lost notification. The dispatcher selects everything with
#     `scheduledFor <= now`, so a late tick delivers the whole backlog at once.
#   * If GitHub Actions is down, the in-app catch-up in GET /api/notifications
#     clears the backlog the moment the user next opens RoutineOS.
#   * A private repo gets 2,000 min/month, which this workflow fits inside with
#     room to spare. A public repo is effectively unlimited.
#   * GitHub disables scheduled workflows in public repos after 60 days of
#     repository inactivity.
#
# ONE-TIME SETUP
#   Settings -> Secrets and variables -> Actions
#     Variable: NOTIFICATION_BASE_URL  = https://your-app.vercel.app
#     Secret:  CRON_SECRET             = (same value as in the app's env)
#   Then run this workflow manually once from the Actions tab to confirm it works.

on:
  schedule:
    # Every 5 minutes. Deliberately minute-of-hour 1,6,11,... rather than
    # 0,5,10,... to avoid landing exactly on the hour, which is GitHub's most
    # contended window and the most likely to be delayed.
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

concurrency:
  # Never let two ticks overlap. The dispatcher is already claim-safe, but
  # serialising also stops a slow run from delaying the next one.
  group: notification-scheduler
  cancel-in-progress: false

jobs:
  tick:
    name: Create and dispatch due notifications
    runs-on: ubuntu-latest
    # Hard ceiling so a hung curl cannot burn the free minutes.
    timeout-minutes: 3
    env:
      BASE_URL: ${{ vars.NOTIFICATION_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check configuration
        if: ${{ env.BASE_URL == '' }}
        run: |
          echo "::error::Repository variable NOTIFICATION_BASE_URL is not set."
          echo "Add it under Settings -> Secrets and variables -> Actions -> Variables."
          exit 1

      - name: Check secret
        if: ${{ env.CRON_SECRET == '' }}
        run: |
          echo "::error::Repository secret CRON_SECRET is not set."
          echo "Add it under Settings -> Secrets and variables -> Actions -> Secrets."
          exit 1

      # ONE call processes EVERYTHING that is due: sleep prompts, the routine /
      # daily / habit / goal / task producers, then the dispatcher.
      #
      # The endpoint is safe to run as often as you like and safe to run late —
      # it selects everything with `scheduledFor <= now` — so a delayed or missed
      # tick produces a LATE notification, never a lost one.
      #
      # No secret is echoed: the response body is a JSON summary of counts.
      - name: Notification tick
        continue-on-error: true
        run: |
          curl -sS --max-time 120 --fail-with-body \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/notification-tick"
